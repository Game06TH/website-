{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0 p-4" style="border-radius: 20px; background-color: #ffffff;">
        
        <div class="row g-5 align-items-center">
            
            <div class="col-lg-7 text-center">
                <div class="rounded-3 p-2">
                    <img src="{{ url_for('static', filename='images/' ~ product.image) }}"
                         class="img-fluid w-100" 
                         alt="{{ product.name }}"
                         style="max-height: 600px; width: auto; object-fit: contain; display: block; margin: 0 auto;">
                    </div>
            </div>

            <div class="col-lg-5">
                <div class="card-body p-0">
                    
                    <div class="mb-2">
                        <span class="badge bg-primary text-white px-3 py-2" style="border-radius: 10px;">
                            {{ product.category }}
                        </span>
                    </div>
                    
                    <h1 class="fw-bold text-dark mb-3" style="font-size: 2rem;">{{ product.name }}</h1>
                    
                    <hr>

                    <div class="mb-4">
                        <h6 class="fw-bold text-muted uppercase small mb-2">รายละเอียดสินค้า</h6>
                        <p class="text-secondary" style="line-height: 1.8; font-size: 1.1rem;">
                            {{ product.description or 'ไม่มีข้อมูลรายละเอียดสินค้า' }}
                        </p>
                    </div>

                    <div class="bg-light p-4 rounded-3 mb-4 border-start border-success border-4">
                        <span class="text-muted d-block mb-1">ราคาจำหน่าย</span>
                        <h3 class="text-success fw-bold mb-0" style="font-size: 1.8rem;">
                            {{ "{:,.2f}".format(product.price) }} บาท
                        </h3>
                    </div>

                    <form method="post" action="{{ url_for('add_to_cart', product_id=product.id) }}">
                        <button type="submit" class="btn btn-lg btn-success w-100 py-3 shadow-sm fw-bold">
                            <i class="bi bi-cart-plus-fill me-2"></i> เพิ่มลงในตะกร้าสินค้า
                        </button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="{{ url_for('index') }}" class="text-muted text-decoration-none small">
                            <i class="bi bi-arrow-left"></i> กลับไปหน้าเลือกสินค้า
                        </a>
                    </div>

                </div>
            </div>

        </div> </div> </div>
{% endblock %}
